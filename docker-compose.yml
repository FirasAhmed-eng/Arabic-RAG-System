version: "3.9"

services:

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile

    container_name: arabic-rag-backend

    ports:
      - "8000:8000"

    env_file:
      - backend/.env

    volumes:
      - ./uploads:/app/uploads

    restart: unless-stopped

  frontend:
    build:
      context: ./frontend

    container_name: arabic-rag-frontend

    ports:
      - "3000:3000"

    depends_on:
      - backend

    restart: unless-stopped